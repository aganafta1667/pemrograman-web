<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Berhasil Masuk / Terdaftar</title>

  <!-- Bootstrap 5.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container d-flex flex-column justify-content-center align-items-center min-vh-100 text-center px-3">
    <div class="card shadow-sm border-0 p-5 rounded-4" style="max-width: 520px; width: 100%;">
      <div class="mb-4">
        <h1 class="fw-bold text-success display-6 mb-2">Berhasil</h1>
        <p class="text-muted" id="success-message">Aksi Anda berhasil diproses ke dalam sistem</p>
      </div>

      <hr class="colorgraph mb-4">

      <div>
        <a href="index.html" class="btn btn-primary btn-lg px-4 fw-semibold rounded-pill">
          Kembali ke Halaman Login
        </a>
      </div>
    </div>
  </div>

  <script>
    // Membaca query parameter untuk menyesuaikan pesan (opsional)
    const urlParams = new URLSearchParams(window.location.search);
    const action = urlParams.get('action');
    const msgElem = document.getElementById('success-message');
    if (action === 'signup') {
      msgElem.innerText = 'Pendaftaran akun Anda telah berhasil! Akun siap digunakan.';
    } else if (action === 'signin') {
      msgElem.innerText = 'Anda berhasil masuk ke dalam akun.';
    }
  </script>
</body>
</html>
