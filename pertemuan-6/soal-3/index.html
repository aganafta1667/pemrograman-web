<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration & Validation Flow</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="screen-registration" class="card form-reg">
        <h1>REGISTRATION FORM</h1>
        <form id="regForm">
            <label>Name:</label>
            <input type="text" id="regName" placeholder="Enter your full name" required>
            <div id="name-error" class="error-msg"></div>

            <label>Address:</label>
            <input type="text" id="regAddress" placeholder="Enter your address" required>

            <label>E-mail Address:</label>
            <input type="text" id="regEmail" placeholder="Enter your email" required>
            <div id="regEmail-error" class="error-msg"></div>

            <label>Password:</label>
            <input type="password" id="regPassword" required>
            <div id="password-error" class="error-msg"></div>

            <label>Select Your Course:</label>
            <select id="regCourse" required>
                <option value="" disabled selected hidden>Select Course</option>
                <option value="course1">Course 1</option>
                <option value="course2">Course 2</option>
            </select>

            <label>College Name:</label>
            <textarea id="regCollege" rows="3" required></textarea>

            <div class="checkbox-group">
                <input type="checkbox" id="regAgree" required>
                <label for="regAgree">I agree to the above information</label>
            </div>

            <div class="button-group">
                <button type="submit" class="btn-blue">Send</button>
                <button type="reset" class="btn-blue">Reset</button>
            </div>
        </form>
    </div>

    <div id="screen-email" class="card form-email" style="display: none;">
        <h2>Email Validation Form</h2>
        <form id="emailForm">
            <label>Enter your email:</label>
            <input type="text" id="valEmail" placeholder="example@domain.com" required>
            <span id="email-error" class="error-msg"></span>
            
            <button type="submit" class="btn-green">Submit</button>
        </form>
    </div>

    <div id="screen-success" class="card form-success" style="display: none;">
        <h2>Berhasil</h2>
        <a href="#" id="backLink">Kembali ke Registration Form</a>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
