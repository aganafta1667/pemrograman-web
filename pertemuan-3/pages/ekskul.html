    <div id="site-footer"></div>
    <script src="../js/main.js"></script>
    <script>
      const PAGE_SIZE = 6;
      let currentPage = 1;
      let currentQuery = "";

      function renderPagination(totalPages) {
        const nav = document.getElementById("pagination");
        if (totalPages <= 1) { nav.innerHTML = ""; return; }

        const btn = (label, page, opts = {}) => `<button data-page="${page}" ${opts.disabled ? "disabled" : ""}
          class="pagination-btn h-9 min-w-9 px-3 rounded-full text-sm font-semibold transition
          ${opts.active ? "bg-ink text-paper" : "border border-ink/15 text-ink-soft hover:border-brick hover:text-brick"}
          ${opts.disabled ? "opacity-30 cursor-not-allowed" : ""}">${label}</button>`;

        let html = btn("‹", currentPage - 1, { disabled: currentPage === 1 });
        for (let p = 1; p <= totalPages; p++) {
          html += btn(p, p, { active: p === currentPage });
        }
        html += btn("›", currentPage + 1, { disabled: currentPage === totalPages });
        nav.innerHTML = html;

        nav.querySelectorAll(".pagination-btn:not([disabled])").forEach((b) => {
          b.addEventListener("click", () => {
            currentPage = Number(b.dataset.page);
            renderAchievements();
            window.scrollTo({ top: document.getElementById("achievement-list").offsetTop - 140, behavior: "smooth" });
          });
        });
      }
      document.addEventListener("components:ready", initApp);
      document.addEventListener("DOMContentLoaded", initApp);
    </script>
  </body>
